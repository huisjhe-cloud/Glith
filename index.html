<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e08">
  <title>GAVU STORE | ستايلك كله هنا</title>
  <meta name="description" content="GAVU STORE - ملابس رجالي وكوتشيهات. ستايلك كله هنا.">
  <style>
    :root{--gold:#e8c75c;--gold2:#f8e9a7;--ink:#100e08;--cream:#fff6d9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--cream);font-family:Tahoma,Arial,sans-serif;background:
      radial-gradient(ellipse at 50% 10%,rgba(194,151,44,.23),transparent 42%),
      linear-gradient(145deg,#211b0c,#090907 65%,#1a1509);display:flex;justify-content:center;padding:22px 14px}
    .page{width:min(100%,680px);min-height:calc(100vh - 44px);position:relative;border:1px solid rgba(232,199,92,.7);border-radius:10px;padding:34px 24px 28px;text-align:center;overflow:hidden;box-shadow:0 0 35px #0009,inset 0 0 45px #d3a93a12}
    .page:before,.page:after{content:"";position:absolute;width:56px;height:56px;border-color:var(--gold);border-style:solid;pointer-events:none}
    .page:before{top:0;right:0;border-width:3px 3px 0 0}
    .page:after{bottom:0;left:0;border-width:0 0 3px 3px}
    .brand-mark{width:156px;height:156px;margin:4px auto 20px;border:8px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-family:Georgia,serif;font-size:94px;font-weight:bold;line-height:1;box-shadow:0 0 0 13px #d6ad3520,0 0 36px #d6ad3540}
    h1{font: bold clamp(2.1rem,8vw,4rem) Georgia,serif;letter-spacing:.14em;color:var(--gold);margin:12px 0 24px;direction:ltr}
    h2{font-size:clamp(1.5rem,5vw,2rem);margin:0 0 10px;color:#fff7df}
    .tagline{font-size:1.2rem;color:var(--gold2);margin:0 0 30px}
    .ornament{display:flex;align-items:center;gap:14px;justify-content:center;margin:0 auto 28px;color:var(--gold)}
    .ornament:before,.ornament:after{content:"";height:1px;width:30%;background:linear-gradient(90deg,transparent,var(--gold))}
    .ornament:after{transform:scaleX(-1)}
    .ornament span{font-size:22px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    a{color:inherit;text-decoration:none}
    .btn{min-height:82px;border:1px solid #b99a42;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:13px;font-size:1.25rem;font-weight:bold;background:#171308d9;transition:.2s;box-shadow:0 8px 18px #0005}
    .btn:hover{transform:translateY(-3px);border-color:var(--gold2)}
    .btn.primary{grid-column:1/-1;background:linear-gradient(110deg,#f6e59b,#c89d31);color:#171105;border:0;font-size:1.55rem;min-height:100px}
    .ico{font-size:1.65rem;line-height:1}
    .social-title{margin:42px 0 22px;color:#d8c995;font-size:1.1rem}
    .socials{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .social{display:flex;flex-direction:column;align-items:center;gap:12px;font-weight:bold;color:var(--gold2)}
    .social .circle{width:88px;height:88px;border:1px solid #c6a64d;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:#171308a8;transition:.2s}
    .social:hover .circle{background:#d2ad4d;color:#171105;transform:translateY(-3px)}
    .social small{font-size:1rem}
    footer{margin-top:52px;padding-top:18px;border-top:1px solid #b99a4255;color:#d5c58d;font-size:1rem}
    @media(max-width:420px){.page{padding:28px 14px 22px}.brand-mark{width:132px;height:132px;font-size:78px}.btn{font-size:1.05rem;min-height:72px}.btn.primary{min-height:88px}.social .circle{width:72px;height:72px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brand-mark" aria-label="GAVU">V</div>
    <h1>GAVU STORE</h1>
    <h2>ستايلك كله هنا</h2>
    <p class="tagline">ملابس رجالي وكوتشيهات</p>
    <div class="ornament"><span>◆</span></div>

    <section class="actions" aria-label="التواصل">
      <!-- استبدل الرقمين برقم واتساب ورقم الاتصال بصيغة دولية بدون + -->
      <a class="btn primary" href="https://wa.me/201117549514" target="_blank" rel="noopener">
        <span class="ico">◉</span> واتساب
      </a>
      <a class="btn" href="tel:+201117549514"><span class="ico">☎</span> اتصال</a>
      <a class="btn" href="https://wa.me/201117549514?text=مرحباً،%20أريد%20حفظ%20رقمكم" target="_blank" rel="noopener">
        <span class="ico">＋</span> حفظ الرقم
      </a>
    </section>

    <p class="social-title">تابعنا على السوشيال ميديا</p>
    <section class="socials">
      <a class="social" href="https://www.tiktok.com/" target="_blank" rel="noopener">
        <span class="circle">♪</span><small>تيك توك</small>
      </a>
      <a class="social" href="https://www.instagram.com/abdo.dy85?jplx=MXB4bXo5YWM4OGFtdw==" target="_blank" rel="noopener">
        <span class="circle">◎</span><small>انستجرام</small>
      </a>
      <a class="social" href="https://www.facebook.com/share/1FHY5zyeqd/" target="_blank" rel="noopener">
        <span class="circle">f</span><small>فيسبوك</small>
      </a>
    </section>
    <footer>الدفع والتحويل • شكراً لزيارتكم GAVU STORE</footer>
  </main>
</body>
</html>
